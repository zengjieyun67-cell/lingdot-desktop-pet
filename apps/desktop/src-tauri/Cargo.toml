[package]
name = "desktop-pet"
version = "0.1.0"
description = "桌面智能桌宠"
edition = "2021"
license = "MIT"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [".", "pet-core"]

[build-dependencies]
tauri-build = "2.7.2"

[dependencies]
keyring = { version = "3", features = ["apple-native"] }
pet-core = { path = "pet-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon", "macos-private-api", "protocol-asset", "image-png", "devtools"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
