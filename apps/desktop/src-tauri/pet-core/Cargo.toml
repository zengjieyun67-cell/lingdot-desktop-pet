[package]
name = "pet-core"
version = "0.1.0"
edition = "2021"
description = "Tauri-independent core of the desktop pet: state machine, protocol validation, SQLite store, local event server."
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.53.3", features = ["io-util", "rt-multi-thread", "macros"] }
