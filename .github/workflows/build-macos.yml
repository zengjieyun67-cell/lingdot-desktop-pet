name: Build macOS DMG + Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            target: aarch64-apple-darwin
          - runner: macos-15-intel   # Intel
            target: x86_64-apple-darwin
          - runner: windows-latest   # Windows x64: NSIS -setup.exe + .msi
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm test:rust
      - run: pnpm --filter @desktop-pet/browser-extension build
      - run: pnpm --filter @desktop-pet/desktop tauri build --target ${{ matrix.target }}
        if: runner.os == 'macOS'
      - run: pnpm --filter @desktop-pet/desktop tauri build --target ${{ matrix.target }} --bundles nsis,msi
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: lingdot-desktop-pet-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      # Portable: the bare app exe (frontend is embedded; needs only WebView2, built into Win10/11).
      - run: |
          mkdir portable
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/desktop-pet.exe portable/lingdot-desktop-pet_x64-portable.exe
        shell: bash
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: lingdot-desktop-pet-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            portable/*.exe
      - run: cd apps/browser-extension && zip -r ../../browser-extension.zip dist
        if: matrix.target == 'aarch64-apple-darwin'
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with: { name: browser-extension, path: browser-extension.zip }
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: ls -R out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: lingdot-desktop-pet build ${{ github.run_number }}
          files: |
            out/**/*.dmg
            out/**/*.exe
            out/**/*.msi
            out/**/*.zip
